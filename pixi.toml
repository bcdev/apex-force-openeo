[workspace]
authors = [
    "Hannes Neuschmidt <hannes.neuschmidt@brockmann-consult.de>",
    "Martin Böttcher <martin.boettcher@brockmann-consult.de>"
]
channels = ["conda-forge"]
name = "apex-force-openeo"
platforms = ["linux-64"]
version = "0.6.1-dev0"

[tasks]
test-openeo = { cmd = [ "pytest", "test/openeo" ], default-environment = "test" }
test-eoap-l2 = { cmd = [ "bash", "test/test_force_level2_cltool.sh", "docker" ], default-environment = "test" }
test-eoap-tsa = { cmd = [ "bash", "test/test_force_tsa_cltool.sh", "docker" ], default-environment = "test" }
test-all = [{ task = "test-eoap-l2" }, { task = "test-eoap-tsa" }, { task = "test-openeo" }]

check-version-matches = { cmd = [ "./tools/check-version-matches.sh" ] }

preview = { cmd = "quarto preview", default-environment = "docs", cwd = "docs/force/" }

[environments]
test = ["cwl", "test"]
docs = ["docs", "stac", "examples", "jupyter"]
examples = ["examples", "stac", "jupyter"]
tools = ["cwl", "tools"]
apex-force-openeo = ["tools", "cwl", "test", "dev"]

[dependencies]
pixi-pycharm = ">=0.0.11,<0.0.12"
openeo = ">=0.50.0,<0.51"

[feature.test.dependencies]
pytest = ">=9.1.1,<10"

[feature.jupyter.dependencies]
jupyterlab = ">=4.6.1,<5"

[feature.cwl.dependencies]
cwltool = ">=3.2.20260413085819, <4"

[feature.docs.dependencies]
quarto = ">=1.9.38,<2"
typst = ">=0.14.2,<0.15"

[feature.stac.dependencies]
pystac-client = ">=0.9.0,<0.10"
pystac = ">=1.14.3,<2"

[feature.examples.dependencies]
geopandas = ">=1.1.4,<2"
shapely = ">=2.1.2,<3"
contextily = ">=1.7.1,<2"
rioxarray = ">=0.21.0,<0.22"

[feature.tools.dependencies]
tomlq = ">=0.2.2,<0.3"

[feature.tools.pypi-dependencies]
force-python-utils = { path = "./python/", editable = true }

[feature.dev.dependencies]
ruff = ">=0.16.0,<0.17"
